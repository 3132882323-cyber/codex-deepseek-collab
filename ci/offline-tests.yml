name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # No installation step: the client and tests use Node built-ins only.
      - run: npm run check
      - name: Parse Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $scriptPath = Join-Path $PWD 'skills/deepseek-collaboration/scripts/configure-windows.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
